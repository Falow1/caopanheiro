publish_to: 'none'
resolution: workspace
version: 1.4.0+25

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  caopanheiro_core: ^0.1.0
  caopanheiro_contracts: ^0.1.0
  caopanheiro_design_system: ^0.1.0
  cupertino_icons: ^1.0.8
