<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selecionar endereço</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>html,body,#map{height:100%;margin:0}body{font:14px Arial;background:#f4f6f3}#error{padding:16px}.pin{width:20px;height:20px;background:#176b65;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px #0005;cursor:grab}</style></head>
<body><div id="map" role="region" aria-label="Mapa: toque para marcar o ponto e arraste o marcador para ajustar"><div id="error">Carregando mapa… Se não carregar, use a busca de endereço.</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// The point of the address: a tap or a click marks it, the marker can be
// dragged to adjust it, and the page that holds the map moves it (search
// result, location of the device). Messages go only to and from the same
// origin, the parent window and this channel.
if(window.L){const q=new URLSearchParams(location.search),channel=q.get('channel'),lat=Number(q.get('lat')),lng=Number(q.get('lng'));document.getElementById('error').remove();
const valid=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&a>=-90&&a<=90&&b>=-180&&b<=180;
const map=L.map('map').setView([valid(lat,lng)?lat:-15.601,valid(lat,lng)?lng:-56.097],q.get('marker')==='1'?17:14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}).addTo(map);
let marker;const icon=L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[26,26],iconAnchor:[13,13]});
const send=p=>parent.postMessage(JSON.stringify({channel,lat:p.lat,lng:p.lng}),location.origin);
const place=(p,center)=>{if(marker)marker.setLatLng(p);else{marker=L.marker(p,{icon,draggable:true,keyboard:true,title:'Ponto do endereço',alt:'Ponto do endereço'}).addTo(map);marker.on('dragend',()=>send(marker.getLatLng()));}if(center)map.setView(p,Math.max(map.getZoom(),17));};
if(q.get('marker')==='1'&&valid(lat,lng))place(L.latLng(lat,lng),false);
map.on('click',e=>{place(e.latlng,false);send(e.latlng);});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;try{const v=JSON.parse(e.data);if(v.channel!==channel||!valid(v.lat,v.lng))return;place(L.latLng(v.lat,v.lng),true);}catch(_){}});}
</script></body></html>
