<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selecionar endereço</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>html,body,#map{height:100%;margin:0}body{font:14px Arial;background:#f4f6f3}#error{padding:16px}.pin{width:20px;height:20px;background:#176b65;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px #0005}</style></head>
<body><div id="map" role="region" aria-label="Mapa: toque para selecionar o ponto"><div id="error">Carregando mapa… Se não carregar, use a busca de endereço.</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
if(window.L){const q=new URLSearchParams(location.search),lat=Number(q.get('lat')),lng=Number(q.get('lng'));document.getElementById('error').remove();const map=L.map('map').setView([Number.isFinite(lat)?lat:-15.601,Number.isFinite(lng)?lng:-56.097],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}).addTo(map);let marker;map.on('click',e=>{if(marker)marker.remove();marker=L.marker(e.latlng,{icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);parent.postMessage(JSON.stringify({channel:q.get('channel'),lat:e.latlng.lat,lng:e.latlng.lng}),location.origin);});}
</script></body></html>
