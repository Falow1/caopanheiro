# Servidor do backend da branch dev-banco-fly (docs/DEVOPS.md). O nome do app
# é o esperado pelos apps em CAOPANHEIRO_API_URL; trocar os dois juntos.
# Segredos (fly secrets set): FIREBASE_SERVICE_ACCOUNT e CAOPANHEIRO_WEB_API_KEY.
app = 'caopanheiro-staging-api'
primary_region = 'gru'
kill_signal = 'SIGINT'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  GCLOUD_PROJECT = 'caopanheiro-staging-fly'
  SAAS_DEMO_SKIP_CODE = 'true'
  PORT = '8080'

# A máquina para sem chamadas e volta na primeira: a cobrança é por tempo ligada.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = '20s'
    interval = '60s'
    method = 'GET'
    path = '/live'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
